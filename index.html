<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>經典貪食蛇 - HTML5版</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #4CAF50;
            --apple-color: #ff3333;
            --grid-line: #1a1a1a;
            --ui-bg: rgba(20, 20, 20, 0.9);
        }

        * {
            box-sizing: border-box;
            touch-action: manipulation;
            /* 防止手機雙擊縮放 */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .score-board {
            display: flex;
            gap: 20px;
            font-size: 1.2rem;
            margin-top: 5px;
        }

        .score-item span {
            font-weight: bold;
            color: var(--accent-color);
        }

        /* 遊戲容器 */
        #game-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            border: 2px solid #333;
        }

        canvas {
            display: block;
            background-color: var(--bg-color);
            /* 設定背景網格效果 (可選) */
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* 遊戲狀態覆蓋層 (開始/結束) */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--ui-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.3s;
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--text-color);
        }

        .overlay p {
            margin-bottom: 2rem;
            color: #ccc;
        }

        button.btn-primary {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.4);
        }

        button.btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.6);
        }

        button.btn-primary:active {
            transform: scale(0.95);
        }

        /* 手機虛擬控制器 */
        .controls {
            display: none;
            /* 預設隱藏，JS偵測到手機或小螢幕時顯示 */
            margin-top: 20px;
            display: grid;
            grid-template-columns: 60px 60px 60px;
            grid-template-rows: 60px 60px;
            gap: 10px;
            justify-content: center;
        }

        @media (min-width: 769px) {
            .controls {
                display: none !important;
                /* 桌面版隱藏虛擬按鍵 */
            }
        }

        .d-pad-btn {
            background-color: #333;
            border: 1px solid #555;
            border-radius: 12px;
            color: white;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            transition: background 0.1s;
        }

        .d-pad-btn:active {
            background-color: #555;
        }

        .d-pad-up {
            grid-column: 2;
            grid-row: 1;
        }

        .d-pad-left {
            grid-column: 1;
            grid-row: 2;
        }

        .d-pad-down {
            grid-column: 2;
            grid-row: 2;
        }

        .d-pad-right {
            grid-column: 3;
            grid-row: 2;
        }
    </style>
</head>

<body>

    <header>
        <h1>貪食蛇大作戰</h1>
        <div class="score-board">
            <div class="score-item">分數: <span id="score">0</span></div>
            <div class="score-item">最高分: <span id="high-score">0</span></div>
        </div>
    </header>

    <main id="game-container">
        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <!-- 開始/暫停/結束畫面 -->
        <div id="start-screen" class="overlay">
            <h2>準備好了嗎？</h2>
            <p>使用方向鍵或按鈕控制移動</p>
            <button class="btn-primary" onclick="startGame()">開始遊戲</button>
        </div>

        <div id="game-over-screen" class="overlay hidden">
            <h2 style="color: #ff5252;">遊戲結束</h2>
            <p>最終得分: <span id="final-score">0</span></p>
            <button class="btn-primary" onclick="startGame()">再玩一次</button>
        </div>
    </main>

    <!-- 手機控制器 -->
    <div class="controls" id="mobile-controls">
        <div class="d-pad-btn d-pad-up" onclick="handleInput('ArrowUp')">▲</div>
        <div class="d-pad-btn d-pad-left" onclick="handleInput('ArrowLeft')">◀</div>
        <div class="d-pad-btn d-pad-down" onclick="handleInput('ArrowDown')">▼</div>
        <div class="d-pad-btn d-pad-right" onclick="handleInput('ArrowRight')">▶</div>
    </div>

    <script>
        // --- 遊戲設定變數 ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');
        const finalScoreEl = document.getElementById('final-score');
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const mobileControls = document.getElementById('mobile-controls');

        // 格子設定
        const gridSize = 20; // 每一格 20x20 像素
        let tileCount = canvas.width / gridSize;

        // 遊戲狀態
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gameLoopInterval;
        let speed = 100; // 更新間隔 (毫秒)，數字越小越快

        // 蛇與蘋果
        let snake = [];
        let apple = { x: 5, y: 5 };

        // 移動方向 (x, y)
        let velocity = { x: 0, y: 0 };
        let nextVelocity = { x: 0, y: 0 }; // 防止在一個 tick 內快速按兩次鍵導致反向自殺

        // 初始化顯示最高分
        highScoreEl.innerText = highScore;

        // 檢查是否為觸控裝置，顯示控制器
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            mobileControls.style.display = 'grid';
        }

        // --- 遊戲核心邏輯 ---

        function startGame() {
            // 重置狀態
            snake = [
                { x: 10, y: 10 }, // 蛇頭
                { x: 10, y: 11 }, // 蛇身
                { x: 10, y: 12 }  // 蛇尾
            ];
            velocity = { x: 0, y: -1 }; // 初始向上移動
            nextVelocity = { x: 0, y: -1 };
            score = 0;
            scoreEl.innerText = score;
            speed = 120;

            // 隱藏選單
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');

            // 生成第一顆蘋果
            placeApple();

            // 開始循環
            gameRunning = true;
            if (gameLoopInterval) clearInterval(gameLoopInterval);
            gameLoopInterval = setInterval(gameLoop, speed);
        }

        function gameLoop() {
            if (!gameRunning) return;

            update();
            draw();
        }

        function update() {
            // 更新方向
            velocity = { ...nextVelocity };

            // 計算新的蛇頭位置
            const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

            // 1. 檢查是否撞牆
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver();
                return;
            }

            // 2. 檢查是否撞到自己 (從第0個開始檢查，因為還沒加進去)
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver();
                    return;
                }
            }

            // 將新蛇頭加入陣列最前面
            snake.unshift(head);

            // 3. 檢查是否吃到蘋果
            if (head.x === apple.x && head.y === apple.y) {
                score++;
                scoreEl.innerText = score;
                // 稍微加快速度 (每吃5個加速一次，有上限)
                if (score % 5 === 0 && speed > 50) {
                    clearInterval(gameLoopInterval);
                    speed -= 5;
                    gameLoopInterval = setInterval(gameLoop, speed);
                }
                placeApple();
                // 吃到蘋果不移除尾巴 -> 蛇變長
            } else {
                // 沒吃到蘋果，移除尾巴 -> 保持長度移動
                snake.pop();
            }
        }

        function draw() {
            // 清空畫布
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-color');
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 畫蘋果 (紅色圓形)
            ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--apple-color');
            ctx.beginPath();
            let appleRadius = gridSize / 2 - 2;
            ctx.fillRect(apple.x * gridSize + 2, apple.y * gridSize + 2, gridSize - 4, gridSize - 4); // 方形蘋果比較經典

            // 畫蛇
            snake.forEach((segment, index) => {
                // 蛇頭顏色稍亮，身體稍暗
                if (index === 0) {
                    ctx.fillStyle = '#66ff66'; // 蛇頭亮綠
                } else {
                    ctx.fillStyle = '#4CAF50'; // 蛇身標準綠
                }

                // 畫出蛇的每一節，留一點間隙看起來有格子的感覺
                ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);

                // 給蛇頭畫眼睛 (可愛的細節)
                if (index === 0) {
                    ctx.fillStyle = 'black';
                    // 根據方向畫眼睛位置
                    let eyeOffsetX = 0, eyeOffsetY = 0;
                    if (velocity.x === 1) eyeOffsetX = 4;
                    if (velocity.x === -1) eyeOffsetX = -4;
                    if (velocity.y === 1) eyeOffsetY = 4;
                    if (velocity.y === -1) eyeOffsetY = -4;

                    ctx.fillRect(segment.x * gridSize + 6 + eyeOffsetX, segment.y * gridSize + 6 + eyeOffsetY, 2, 2);
                    ctx.fillRect(segment.x * gridSize + 12 + eyeOffsetX, segment.y * gridSize + 6 + eyeOffsetY, 2, 2);
                }
            });
        }

        function placeApple() {
            // 隨機生成位置
            let valid = false;
            while (!valid) {
                apple.x = Math.floor(Math.random() * tileCount);
                apple.y = Math.floor(Math.random() * tileCount);

                // 確保蘋果不會生成在蛇的身體上
                valid = true;
                for (let part of snake) {
                    if (part.x === apple.x && part.y === apple.y) {
                        valid = false;
                        break;
                    }
                }
            }
        }

        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoopInterval);

            // 更新最高分
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreEl.innerText = highScore;
            }

            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove('hidden');
        }

        // --- 輸入控制 ---

        function handleInput(key) {
            if (!gameRunning) return;

            // 防止反向移動 (例如：正在向右時不能直接按左)
            // 使用 nextVelocity 確保在同一個更新幀內不會連續轉向導致撞到自己

            switch (key) {
                case 'ArrowUp':
                    if (velocity.y === 0) nextVelocity = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                    if (velocity.y === 0) nextVelocity = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                    if (velocity.x === 0) nextVelocity = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                    if (velocity.x === 0) nextVelocity = { x: 1, y: 0 };
                    break;
            }
        }

        document.addEventListener('keydown', (e) => {
            // 防止方向鍵滾動頁面
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
            handleInput(e.code);
        });

        // 初始繪製一次背景
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--bg-color');
        ctx.fillRect(0, 0, canvas.width, canvas.height);

    </script>
</body>

</html>
```
