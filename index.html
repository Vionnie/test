<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 貪食蛇遊戲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #111;
            font-family: 'Arial', sans-serif;
            color: #fff;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            color: #4CAF50;
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .subtitle {
            color: #ddd;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .game-container {
            position: relative;
            margin-bottom: 20px;
        }

        canvas {
            border: 3px solid #4CAF50;
            border-radius: 5px;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.3);
            background-color: #000;
        }

        .info-panel {
            display: flex;
            justify-content: space-between;
            width: 600px;
            margin-bottom: 20px;
            background-color: #222;
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .score,
        .high-score {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .score {
            color: #4CAF50;
        }

        .high-score {
            color: #FF9800;
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            width: 600px;
            background-color: #222;
            padding: 20px;
            border-radius: 8px;
        }

        .control-info {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .control-item {
            text-align: center;
        }

        .control-item h3 {
            color: #4CAF50;
            margin-bottom: 5px;
        }

        .buttons {
            display: flex;
            gap: 15px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        button#restartBtn {
            background-color: #FF9800;
        }

        button#restartBtn:hover {
            background-color: #f57c00;
        }

        .instructions {
            margin-top: 25px;
            background-color: #222;
            padding: 20px;
            border-radius: 8px;
            width: 600px;
        }

        .instructions h3 {
            color: #4CAF50;
            margin-bottom: 10px;
            text-align: center;
        }

        .instructions ul {
            padding-left: 20px;
            color: #ddd;
            line-height: 1.6;
        }

        .instructions li {
            margin-bottom: 8px;
        }

        .game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 5px;
            z-index: 10;
            display: none;
        }

        .game-over h2 {
            color: #f44336;
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .game-over p {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        .footer {
            margin-top: 30px;
            color: #777;
            text-align: center;
            font-size: 0.9rem;
        }

        @media (max-width: 650px) {
            canvas {
                width: 95vw;
                height: auto;
            }

            .info-panel,
            .controls,
            .instructions {
                width: 95vw;
            }

            .control-info {
                flex-direction: column;
                gap: 15px;
            }

            h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>貪食蛇遊戲</h1>
        <div class="subtitle">控制蛇吃紅色蘋果，每吃一個蘋果蛇身會變長</div>
    </div>

    <div class="info-panel">
        <div class="score">分數: <span id="score">0</span></div>
        <div class="high-score">最高分數: <span id="highScore">0</span></div>
    </div>

    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="450"></canvas>

        <div class="game-over" id="gameOverScreen">
            <h2>遊戲結束!</h2>
            <p>你的分數: <span id="finalScore">0</span></p>
            <button id="restartBtn">重新開始遊戲</button>
        </div>
    </div>

    <div class="controls">
        <div class="control-info">
            <div class="control-item">
                <h3>控制方式</h3>
                <p>方向鍵 ↑ ↓ ← →</p>
            </div>
            <div class="control-item">
                <h3>遊戲規則</h3>
                <p>吃紅色蘋果變長</p>
            </div>
            <div class="control-item">
                <h3>目標</h3>
                <p>獲得最高分數</p>
            </div>
        </div>

        <div class="buttons">
            <button id="startBtn">開始遊戲</button>
            <button id="pauseBtn">暫停遊戲</button>
        </div>
    </div>

    <div class="instructions">
        <h3>遊戲說明</h3>
        <ul>
            <li>使用鍵盤方向鍵控制蛇的移動方向</li>
            <li>蛇頭碰到紅色蘋果，蛇身會變長，分數增加10分</li>
            <li>蛇頭撞到牆壁或自己的身體，遊戲結束</li>
            <li>遊戲速度會隨著分數增加而逐漸加快</li>
            <li>盡可能獲得高分並挑戰自己的最高紀錄</li>
        </ul>
    </div>

    <div class="footer">
        HTML5 Canvas 貪食蛇遊戲 | 背景黑色 | 吃到紅蘋果會變長
    </div>

    <script>
        // 獲取Canvas元素和上下文
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 遊戲變數
        let snake = [];
        let food = {};
        let direction = 'right';
        let nextDirection = 'right';
        let gameSpeed = 150; // 初始速度（毫秒）
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gameLoop;

        // DOM元素
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const finalScoreElement = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');

        // 初始化遊戲
        function initGame() {
            // 初始化蛇
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];

            // 初始化食物
            generateFood();

            // 重置遊戲狀態
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            gameSpeed = 150;
            scoreElement.textContent = score;
            highScoreElement.textContent = highScore;

            // 隱藏遊戲結束畫面
            gameOverScreen.style.display = 'none';
        }

        // 生成食物
        function generateFood() {
            // 確保食物不會生成在蛇身上
            let foodOnSnake;
            do {
                foodOnSnake = false;
                food = {
                    x: Math.floor(Math.random() * (canvas.width / 15)),
                    y: Math.floor(Math.random() * (canvas.height / 15))
                };

                // 檢查食物是否在蛇身上
                for (let segment of snake) {
                    if (segment.x === food.x && segment.y === food.y) {
                        foodOnSnake = true;
                        break;
                    }
                }
            } while (foodOnSnake);
        }

        // 繪製遊戲元素
        function draw() {
            // 清除畫布（黑色背景）
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 繪製蛇
            for (let i = 0; i < snake.length; i++) {
                // 蛇頭用不同顏色
                if (i === 0) {
                    ctx.fillStyle = '#2E7D32'; // 深綠色蛇頭
                } else {
                    ctx.fillStyle = '#4CAF50'; // 綠色蛇身
                }

                // 繪製蛇身方格
                ctx.fillRect(snake[i].x * 15, snake[i].y * 15, 14, 14);

                // 繪製蛇身方格邊框
                ctx.strokeStyle = '#388E3C';
                ctx.strokeRect(snake[i].x * 15, snake[i].y * 15, 14, 14);

                // 繪製蛇眼睛
                if (i === 0) {
                    ctx.fillStyle = '#000';

                    // 根據方向繪製眼睛位置
                    let eye1X, eye1Y, eye2X, eye2Y;

                    if (direction === 'right') {
                        eye1X = snake[i].x * 15 + 10;
                        eye1Y = snake[i].y * 15 + 4;
                        eye2X = snake[i].x * 15 + 10;
                        eye2Y = snake[i].y * 15 + 10;
                    } else if (direction === 'left') {
                        eye1X = snake[i].x * 15 + 4;
                        eye1Y = snake[i].y * 15 + 4;
                        eye2X = snake[i].x * 15 + 4;
                        eye2Y = snake[i].y * 15 + 10;
                    } else if (direction === 'up') {
                        eye1X = snake[i].x * 15 + 4;
                        eye1Y = snake[i].y * 15 + 4;
                        eye2X = snake[i].x * 15 + 10;
                        eye2Y = snake[i].y * 15 + 4;
                    } else { // down
                        eye1X = snake[i].x * 15 + 4;
                        eye1Y = snake[i].y * 15 + 10;
                        eye2X = snake[i].x * 15 + 10;
                        eye2Y = snake[i].y * 15 + 10;
                    }

                    ctx.beginPath();
                    ctx.arc(eye1X, eye1Y, 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(eye2X, eye2Y, 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // 繪製食物（紅色蘋果）
            ctx.fillStyle = '#F44336'; // 紅色
            ctx.beginPath();
            ctx.arc(food.x * 15 + 7, food.y * 15 + 7, 6, 0, Math.PI * 2);
            ctx.fill();

            // 繪製蘋果梗
            ctx.fillStyle = '#8D6E63';
            ctx.fillRect(food.x * 15 + 7, food.y * 15, 2, 4);

            // 繪製蘋果葉子
            ctx.fillStyle = '#4CAF50';
            ctx.beginPath();
            ctx.ellipse(food.x * 15 + 4, food.y * 15 + 2, 3, 2, 0, 0, Math.PI * 2);
            ctx.fill();
        }

        // 更新遊戲狀態
        function update() {
            // 更新蛇的方向
            direction = nextDirection;

            // 根據方向移動蛇頭
            let head = { x: snake[0].x, y: snake[0].y };

            switch (direction) {
                case 'right':
                    head.x++;
                    break;
                case 'left':
                    head.x--;
                    break;
                case 'up':
                    head.y--;
                    break;
                case 'down':
                    head.y++;
                    break;
            }

            // 檢查是否撞牆
            if (
                head.x < 0 ||
                head.x >= canvas.width / 15 ||
                head.y < 0 ||
                head.y >= canvas.height / 15
            ) {
                gameOver();
                return;
            }

            // 檢查是否撞到自己
            for (let segment of snake) {
                if (head.x === segment.x && head.y === segment.y) {
                    gameOver();
                    return;
                }
            }

            // 將新頭部添加到蛇身
            snake.unshift(head);

            // 檢查是否吃到食物
            if (head.x === food.x && head.y === food.y) {
                // 增加分數
                score += 10;
                scoreElement.textContent = score;

                // 生成新食物
                generateFood();

                // 每得50分增加遊戲速度
                if (score % 50 === 0 && gameSpeed > 50) {
                    gameSpeed -= 10;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(gameStep, gameSpeed);
                }
            } else {
                // 如果沒有吃到食物，移除尾部
                snake.pop();
            }
        }

        // 遊戲步驟
        function gameStep() {
            update();
            draw();
        }

        // 遊戲結束
        function gameOver() {
            gameRunning = false;
            clearInterval(gameLoop);

            // 更新最高分數
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
                highScoreElement.textContent = highScore;
            }

            // 顯示遊戲結束畫面
            finalScoreElement.textContent = score;
            gameOverScreen.style.display = 'flex';
        }

        // 開始遊戲
        function startGame() {
            if (!gameRunning) {
                initGame();
                gameRunning = true;
                gameLoop = setInterval(gameStep, gameSpeed);
                startBtn.textContent = '重新開始';
            } else {
                // 如果遊戲正在運行，重新開始
                clearInterval(gameLoop);
                initGame();
                gameLoop = setInterval(gameStep, gameSpeed);
            }
        }

        // 暫停/繼續遊戲
        function togglePause() {
            if (gameRunning) {
                clearInterval(gameLoop);
                gameRunning = false;
                pauseBtn.textContent = '繼續遊戲';
            } else if (snake.length > 0) {
                gameRunning = true;
                gameLoop = setInterval(gameStep, gameSpeed);
                pauseBtn.textContent = '暫停遊戲';
            }
        }

        // 鍵盤控制
        document.addEventListener('keydown', (e) => {
            // 防止方向鍵滾動頁面
            if ([37, 38, 39, 40].includes(e.keyCode)) {
                e.preventDefault();
            }

            // 根據按下的鍵更新方向
            switch (e.key) {
                case 'ArrowUp':
                    if (direction !== 'down') nextDirection = 'up';
                    break;
                case 'ArrowDown':
                    if (direction !== 'up') nextDirection = 'down';
                    break;
                case 'ArrowLeft':
                    if (direction !== 'right') nextDirection = 'left';
                    break;
                case 'ArrowRight':
                    if (direction !== 'left') nextDirection = 'right';
                    break;
            }
        });

        // 按鈕事件監聽
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        restartBtn.addEventListener('click', startGame);

        // 初始化遊戲
        initGame();
        draw();
        highScoreElement.textContent = highScore;

        // 添加觸控支持（移動設備）
        let touchStartX = 0;
        let touchStartY = 0;

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;

            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            // 根據滑動方向改變蛇的方向
            if (Math.abs(dx) > Math.abs(dy)) {
                // 水平滑動
                if (dx > 0 && direction !== 'left') {
                    nextDirection = 'right';
                } else if (dx < 0 && direction !== 'right') {
                    nextDirection = 'left';
                }
            } else {
                // 垂直滑動
                if (dy > 0 && direction !== 'up') {
                    nextDirection = 'down';
                } else if (dy < 0 && direction !== 'down') {
                    nextDirection = 'up';
                }
            }
        });
    </script>
</body>

</html>
